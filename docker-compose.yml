version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cabinet-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
    networks:
      - cabinet-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cabinet-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cabinet-network

networks:
  cabinet-network:
    driver: bridge